<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ee8fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="woolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- 羊毛身体 - 云朵状 -->
  <ellipse cx="64" cy="72" rx="38" ry="28" fill="url(#woolGrad)"/>
  <circle cx="38" cy="65" r="14" fill="url(#woolGrad)"/>
  <circle cx="90" cy="65" r="14" fill="url(#woolGrad)"/>
  <circle cx="50" cy="50" r="16" fill="url(#woolGrad)"/>
  <circle cx="78" cy="50" r="16" fill="url(#woolGrad)"/>
  <circle cx="64" cy="45" r="15" fill="url(#woolGrad)"/>
  
  <!-- 耳朵 -->
  <ellipse cx="42" cy="38" rx="8" ry="14" fill="#ffdbac" transform="rotate(-20 42 38)"/>
  <ellipse cx="86" cy="38" rx="8" ry="14" fill="#ffdbac" transform="rotate(20 86 38)"/>
  <ellipse cx="42" cy="40" rx="5" ry="9" fill="#ffb6c1" transform="rotate(-20 42 40)"/>
  <ellipse cx="86" cy="40" rx="5" ry="9" fill="#ffb6c1" transform="rotate(20 86 40)"/>
  
  <!-- 脸部 -->
  <ellipse cx="64" cy="58" rx="22" ry="20" fill="#ffdbac"/>
  
  <!-- 眼睛 -->
  <circle cx="56" cy="54" r="5" fill="#333"/>
  <circle cx="58" cy="52" r="2" fill="#fff"/>
  <circle cx="72" cy="54" r="5" fill="#333"/>
  <circle cx="74" cy="52" r="2" fill="#fff"/>
  
  <!-- 腮红 -->
  <ellipse cx="48" cy="62" rx="5" ry="3" fill="#ffb6c1" opacity="0.6"/>
  <ellipse cx="80" cy="62" rx="5" ry="3" fill="#ffb6c1" opacity="0.6"/>
  
  <!-- 鼻子 -->
  <ellipse cx="64" cy="62" rx="4" ry="3" fill="#ff9999"/>
  
  <!-- 嘴巴 -->
  <path d="M60 68 Q64 72 68 68" stroke="#ff9999" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- 腿部 -->
  <rect x="44" y="90" width="10" height="16" rx="5" fill="#ffdbac"/>
  <rect x="74" y="90" width="10" height="16" rx="5" fill="#ffdbac"/>
  
  <!-- 小装饰 - 星星 -->
  <text x="100" y="30" font-size="16" fill="#ffd700">✨</text>
  <text x="22" y="35" font-size="12" fill="#ffd700">✨</text>
</svg>