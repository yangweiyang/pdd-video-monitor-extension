<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小羊多多</title>
  <style>
    :root {
      --primary: #e53e3e;
      --primary-light: #fc8181;
      --primary-dark: #c53030;
      --primary-glow: rgba(229, 62, 62, 0.35);
      --accent: #ed8936;
      --accent-light: #f6ad55;
      --success: #38a169;
      --success-light: #68d391;
      --warning: #dd6b20;
      --danger: #e53e3e;
      --bg: #fff5f5;
      --surface: #ffffff;
      --text: #2d3748;
      --text-muted: #a0aec0;
      --border: #fed7d7;
      --border-subtle: #feebec;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(229,62,62,0.06);
      --shadow: 0 4px 12px rgba(229,62,62,0.08);
      --shadow-md: 0 8px 24px rgba(229,62,62,0.12);
      --shadow-lg: 0 16px 40px rgba(229,62,62,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 400px;
      min-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, #b83232 50%, #9b2c2c 100%);
      padding: 28px 20px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -60%;
      left: -30%;
      width: 160%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.06));
      pointer-events: none;
    }
    .header-icon {
      width: 54px;
      height: 54px;
      background: rgba(255,255,255,0.18);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
      position: relative;
    }
    .header-icon svg { width: 28px; height: 28px; color: white; }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: white;
      letter-spacing: 1px;
      position: relative;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.82);
      margin-top: 4px;
      position: relative;
      letter-spacing: 0.5px;
    }

    /* ===== Status Bar (floating card) ===== */
    .status-bar {
      background: var(--surface);
      padding: 18px 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: -22px 14px 14px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg), 0 1px 0 rgba(255,255,255,0.8) inset;
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.9);
    }
    .status-item {
      text-align: center;
      padding: 8px 4px 6px;
      border-radius: var(--radius-md);
      transition: all 0.25s ease;
    }
    .status-item:hover {
      background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%);
      transform: translateY(-2px);
    }
    .status-item .icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 7px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .status-item:nth-child(1) .icon-wrap { background: linear-gradient(135deg, #fc8181 0%, #e53e3e 100%); }
    .status-item:nth-child(2) .icon-wrap { background: linear-gradient(135deg, #63b3ed 0%, #3182ce 100%); }
    .status-item:nth-child(3) .icon-wrap { background: linear-gradient(135deg, #f6ad55 0%, #dd6b20 100%); }
    .status-item:nth-child(4) .icon-wrap { background: linear-gradient(135deg, #68d391 0%, #38a169 100%); }
    .status-item .icon-wrap svg { width: 17px; height: 17px; color: white; }
    .status-item .value {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }
    .status-item .label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    /* ===== Buttons ===== */
    .btn {
      padding: 11px 16px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }
    .btn svg { width: 17px; height: 17px; transition: transform 0.25s ease; }
    .btn:hover svg { transform: scale(1.1) rotate(3deg); }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(229,62,62,0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(229,62,62,0.45);
      transform: translateY(-2px);
    }
    .btn-primary:disabled { background: #cbd5e0; color: #a0aec0; cursor: not-allowed; box-shadow: none; }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      border-color: var(--primary-light);
      color: var(--primary);
      background: #fffafa;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-light) 0%, var(--success) 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(56,161,105,0.3);
    }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56,161,105,0.4); }

    .btn-danger {
      background: linear-gradient(135deg, #fc8181 0%, var(--danger) 100%);
      color: white;
    }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229,62,62,0.35); }

    /* ===== Controls Row ===== */
    .controls-row {
      padding: 0 14px;
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .controls-row .btn { flex: 1; }

    /* ===== Video List ===== */
    .video-list {
      max-height: 240px;
      overflow-y: auto;
      padding: 0 14px;
      margin-bottom: 12px;
    }
    .video-list::-webkit-scrollbar { width: 5px; }
    .video-list::-webkit-scrollbar-track { background: transparent; }
    .video-list::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--primary-light), var(--primary));
      border-radius: 3px;
    }
    .video-item {
      background: var(--surface);
      padding: 13px 15px;
      margin-bottom: 9px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .video-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--primary-light), var(--primary));
      opacity: 0;
      transition: opacity 0.25s;
    }
    .video-item:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-md);
      transform: translateX(3px);
    }
    .video-item:hover::before { opacity: 1; }
    .video-title {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 9px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 700;
      line-height: 1.45;
    }
    .video-stats {
      display: flex;
      gap: 7px;
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .video-stats span {
      background: linear-gradient(135deg, #fef5f5 0%, #fee 100%);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border-subtle);
    }
    .video-stats span svg { width: 12px; height: 12px; }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 44px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 2px dashed var(--border);
      margin: 0 14px;
    }
    .empty-state .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .empty-state .icon-wrap svg { width: 36px; height: 36px; color: var(--text-muted); opacity: 0.5; }
    .empty-state p { font-size: 14px; font-weight: 700; }
    .empty-state p.sub { font-size: 12px; margin-top: 5px; opacity: 0.65; font-weight: 400; }

    /* ===== Keep Alive Toggle ===== */
    .keep-alive-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 16px;
      background: var(--surface);
      margin: 0 14px;
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-subtle);
    }
    .keep-alive-toggle .label-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .keep-alive-toggle .icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #feebc8 0%, #fbd38d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .keep-alive-toggle .icon-wrap svg { width: 19px; height: 19px; color: #c05621; }
    .keep-alive-toggle .label { font-size: 14px; font-weight: 700; color: var(--text); }
    .keep-alive-toggle .hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ===== Toggle Switch ===== */
    .toggle { position: relative; width: 50px; height: 27px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #e2e8f0;
      transition: 0.3s;
      border-radius: 27px;
    }
    .toggle .slider:before {
      position: absolute;
      content: "";
      height: 21px;
      width: 21px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .toggle input:checked + .slider {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .toggle input:checked + .slider:before { transform: translateX(23px); }

    /* ===== Last Update Bar ===== */
    .last-update {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 11px 14px;
      background: var(--surface);
      margin: 0 14px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-subtle);
    }
    .last-update svg { width: 14px; height: 14px; }

    /* ===== Update Banner ===== */
    .update-banner {
      margin: 0 14px 10px;
      background: linear-gradient(135deg, #fffaf0 0%, #feebc8 100%);
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      display: none;
      animation: slideUp 0.35s ease-out;
    }
    .update-banner.show { display: block; }
    .update-banner.success {
      background: linear-gradient(135deg, #f0fff4 0%, #c6f6d5 100%);
      border-color: var(--success);
    }
    .update-banner.error {
      background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
      border-color: var(--danger);
    }
    .update-banner .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .update-banner .title {
      font-size: 13px;
      font-weight: 800;
      color: #c05621;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .update-banner.success .title { color: #276749; }
    .update-banner.error .title { color: #c53030; }
    .update-banner .title svg { width: 16px; height: 16px; }
    .update-banner .version-info {
      font-size: 11px;
      color: #c05621;
      margin-bottom: 7px;
      font-weight: 500;
    }
    .update-banner.success .version-info { color: #276749; }
    .update-banner .notes {
      font-size: 11px;
      color: #975a16;
      max-height: 58px;
      overflow-y: auto;
      margin-bottom: 9px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .update-banner.success .notes { color: #22543d; }
    .update-banner .actions { display: flex; gap: 7px; }
    .update-banner .btn-sm {
      padding: 6px 13px;
      font-size: 11px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .update-banner .btn-download {
      background: linear-gradient(135deg, var(--accent) 0%, var(--warning) 100%);
      color: white;
      border: none;
      box-shadow: 0 2px 8px rgba(237,137,54,0.3);
    }
    .update-banner .btn-download:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(237,137,54,0.4); }
    .update-banner .btn-dismiss {
      background: transparent;
      color: #c05621;
      border: 1px solid rgba(192,86,33,0.3);
    }
    .update-banner .btn-dismiss:hover { background: rgba(255,255,255,0.6); }

    /* ===== Check Update Button (footer) ===== */
    .btn-check-update {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 4px 12px;
      font-size: 11px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      box-shadow: 0 2px 8px rgba(229,62,62,0.25);
    }
    .btn-check-update:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(229,62,62,0.35);
    }

    /* ===== Animations ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .status-bar { animation: fadeIn 0.4s ease-out; }
    .controls-row { animation: fadeIn 0.4s ease-out; }
    .controls-row:nth-of-type(2) { animation-delay: 0.05s; animation-fill-mode: backwards; }
    .controls-row:nth-of-type(3) { animation-delay: 0.1s; animation-fill-mode: backwards; }
    .video-list { animation: fadeIn 0.4s ease-out 0.12s; animation-fill-mode: backwards; }
    .keep-alive-toggle { animation: fadeIn 0.4s ease-out 0.16s; animation-fill-mode: backwards; }
    .update-banner { animation-delay: 0.02s; animation-fill-mode: backwards; }
    .last-update { animation: fadeIn 0.4s ease-out 0.2s; animation-fill-mode: backwards; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
    </div>
    <h1>小羊多多</h1>
    <p class="subtitle">拼多多视频智能助手</p>
  </div>

  <!-- Monitor Panel -->
  <div class="tab-content active" id="monitor-panel">
    <!-- Status Cards -->
    <div class="status-bar">
      <div class="status-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/>
            <line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>
            <line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/>
            <line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/>
          </svg>
        </div>
        <div class="value" id="videoCount">0</div>
        <div class="label">视频数</div>
      </div>
      <div class="status-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </div>
        <div class="value" id="totalPlays">0</div>
        <div class="label">总播放</div>
      </div>
      <div class="status-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </div>
        <div class="value" id="totalOrders">0</div>
        <div class="label">总订单</div>
      </div>
      <div class="status-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div class="value" id="totalAmount">¥0</div>
        <div class="label">总金额</div>
      </div>
    </div>

    <!-- Action Buttons Row 1 -->
    <div class="controls-row">
      <button class="btn btn-secondary" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        刷新
      </button>
      <button class="btn btn-primary" id="syncBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9m-9 9a9 9 0 0 1 9-9"/>
        </svg>
        同步
      </button>
    </div>

    <!-- Action Buttons Row 2 -->
    <div class="controls-row">
      <button class="btn btn-secondary" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        导出
      </button>
      <button class="btn btn-secondary" id="clearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
        清空
      </button>
    </div>

    <!-- Video List -->
    <div class="video-list" id="videoList">
      <div class="empty-state">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <p>暂无视频数据</p>
        <p class="sub">请访问拼多多视频页面</p>
      </div>
    </div>

    <!-- Auto Keep Alive -->
    <div class="keep-alive-toggle">
      <div class="label-wrap">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </div>
        <div>
          <div class="label">自动保活</div>
          <div class="hint">每2分钟自动刷新保持登录</div>
        </div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="keepAliveToggle" checked><span class="slider"></span>
      </label>
    </div>

    <!-- Update Banner -->
    <div class="update-banner" id="updateBanner">
      <div class="header-row">
        <div class="title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span id="updateTitle">发现新版本</span>
        </div>
        <button class="btn-sm btn-dismiss" id="dismissUpdateBtn">关闭</button>
      </div>
      <div class="version-info" id="updateVersionInfo"></div>
      <div class="notes" id="updateNotes"></div>
      <div class="actions">
        <button class="btn-sm btn-download" id="downloadUpdateBtn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          下载更新
        </button>
        <button class="btn-sm btn-dismiss" id="recheckUpdateBtn">重新检查</button>
      </div>
    </div>

    <!-- Footer with Update Button -->
    <div class="last-update" id="lastUpdate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>暂无数据</span>
      <button class="btn-sm btn-check-update" id="checkUpdateBtn" title="检查新版本">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
        检查更新
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
